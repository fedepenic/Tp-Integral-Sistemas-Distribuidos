    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - UPSTREAM_INSTANCES=1
      - INPUT_QUEUE=q3_candidates
      - OUTPUT_QUEUE=q3_data
      - EOF_INPUT_EXCHANGE=eof_q3_candidates
      - EOF_INPUT_KEY=amt_avg_filter
