services:
  rabbitmq:
    build:
      context: .
      dockerfile: cmd/rabbitmq/Dockerfile
    environment:
      - RABBITMQ_LOG_LEVELS=error
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    environment:
      - GATEWAY_PORT=8080
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - OUTPUT_QUEUE=raw_transactions
      - REPORTS_QUEUE=reports
      - OUTPUT_DIR=/output/system
    volumes:
      - ../output:/output
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_1:
    build:
      context: .
      dockerfile: cmd/client/Dockerfile
    environment:
      - INSTANCE_ID=1
      - INSTANCE_TOTAL=1
      - GATEWAY_HOST=gateway
      - GATEWAY_PORT=8080
      - INPUT_DIR=/data/client_1
      - BATCH_SIZE=100
    volumes:
      - ../input:/data
    depends_on:
      - gateway

  cleaner_1:
    build:
      context: .
      dockerfile: cmd/cleaner/Dockerfile
    environment:
      - INSTANCE_ID=1
      - INSTANCE_TOTAL=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - INPUT_QUEUE=raw_transactions
      - OUTPUT_EXCHANGE=transactions_clean
      - OUTPUT_KEYS=txn_for_usd,txn_for_q5
      - ACCOUNTS_JOIN_EXCHANGE=join_q2_input
      - EOF_OUTPUT_EXCHANGE=eof_cleaner
      - EOF_OUTPUT_KEYS=period1_q5_filter
      - EOF_EXCHANGE=cleaner_eof
      - ACCOUNTS_JOIN_KEY_PREFIX=joinq2
      - ACCOUNTS_JOIN_PARTITIONS=1
    depends_on:
      rabbitmq:
        condition: service_healthy

  currency_converter_1:
    build:
      context: .
      dockerfile: cmd/currency_converter/Dockerfile
    environment:
      - INSTANCE_ID=1
      - INSTANCE_TOTAL=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - INPUT_QUEUE=wireach_txn
      - OUTPUT_QUEUE=converted_usd
    depends_on:
      rabbitmq:
        condition: service_healthy

  max_per_bank_1:
    build:
      context: .
      dockerfile: cmd/aggregators/max_per_bank/Dockerfile
    environment:
      - INSTANCE_ID=1
      - INSTANCE_TOTAL=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - UPSTREAM_INSTANCES=1
      - INPUT_KEY=maxbank_0
      - INPUT_EXCHANGE=usd_for_q2
      - OUTPUT_EXCHANGE=join_q2_input
      - EOF_CONTROL_EXCHANGE=eof_usd_for_q2
      - EOF_CONTROL_KEY=max_per_bank
      - OUTPUT_KEY_PREFIX=joinq2
      - OUTPUT_PARTITIONS=1
    depends_on:
      rabbitmq:
        condition: service_healthy

  avg_per_payment_format_1:
    build:
      context: .
      dockerfile: cmd/aggregators/avg_per_payment_format/Dockerfile
