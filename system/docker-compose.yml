      - UPSTREAM_INSTANCES=1
      - INPUT_QUEUE=usd_for_q3p2
      - OUTPUT_QUEUE=usd_period2
      - EOF_INPUT_EXCHANGE=eof_usd_filtered
      - EOF_INPUT_KEY=period2_filter
      - EOF_OUTPUT_EXCHANGE=eof_usd_period2


  period1_filter:
