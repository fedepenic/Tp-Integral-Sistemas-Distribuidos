services:
  rabbitmq:
    build:
      context: .
      dockerfile: cmd/rabbitmq/Dockerfile
    environment:
      - RABBITMQ_LOG_LEVELS=error
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s

  gateway:
    build:
      context: .
      dockerfile: cmd/Dockerfile
      args:
        SERVICE_PATH: gateway
    environment:
      - GATEWAY_PORT=8080
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - OUTPUT_QUEUE=raw_transactions
      - REPORTS_QUEUE=reports
      - OUTPUT_DIR=/output/system
    volumes:
      - ../output:/output
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_1:
    build:
      context: .
      dockerfile: cmd/Dockerfile
      args:
        SERVICE_PATH: client
    environment:
      - INSTANCE_ID=1
      - INSTANCE_TOTAL=2
      - GATEWAY_HOST=gateway
      - GATEWAY_PORT=8080
      - INPUT_DIR=/data/client_1
      - BATCH_SIZE=1000
      - TRANSACTIONS_FILE=LI-Small_Trans.csv
      - ACCOUNTS_FILE=LI-Small_accounts.csv
    volumes:
      - ../input:/data
    depends_on:
      - gateway

  client_2:
    build:
      context: .
      dockerfile: cmd/Dockerfile
      args:
        SERVICE_PATH: client
    environment:
      - INSTANCE_ID=2
      - INSTANCE_TOTAL=2
      - GATEWAY_HOST=gateway
      - GATEWAY_PORT=8080
      - INPUT_DIR=/data/client_2
      - BATCH_SIZE=1000
      - TRANSACTIONS_FILE=LI-Small_Trans.csv
      - ACCOUNTS_FILE=LI-Small_accounts.csv
    volumes:
      - ../input:/data
    depends_on:
      - gateway

  cleaner_1:
    build:
      context: .
      dockerfile: cmd/Dockerfile
      args:
        SERVICE_PATH: cleaner
    environment:
      - INSTANCE_ID=1
      - INSTANCE_TOTAL=2
      - INPUT_QUEUE=raw_transactions
      - OUTPUT_EXCHANGE=transactions_clean
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - EOF_EXCHANGE=cleaner_eof
      - ACCOUNTS_JOIN_EXCHANGE=join_q2_input
      - ACCOUNTS_JOIN_KEY_PREFIX=joinq2
      - OUTPUT_KEYS=txn_for_usd
      - ACCOUNTS_JOIN_PARTITIONS=2
      - SKIP_CLEANING=true
    depends_on:
      rabbitmq:
        condition: service_healthy

  cleaner_2:
